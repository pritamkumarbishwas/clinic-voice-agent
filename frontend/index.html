<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI clinic receptionist for appointment booking and call analytics."
    />
    <meta name="theme-color" content="#f7fbfa" />
    <title>Clinic Voice AI</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("clinic-theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          if (dark) document.documentElement.classList.add("dark");

          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", dark ? "#10181b" : "#f7fbfa");
          }
        } catch (error) {
          // Keep the default light theme when storage is unavailable.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
