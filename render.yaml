envVarGroups:
  - name: clinic-voice-shared
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: clinic-receptionist
      - key: SARVAM_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: clinic_voice_ai
      - key: CLINIC_TIMEZONE
        value: Asia/Kolkata
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: AUTH_COOKIE_NAME
        value: clinic_access_token
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"

services:
  - type: web
    name: clinic-voice-api
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - fromGroup: clinic-voice-shared
      - key: ANALYSIS_WORKER_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: clinic-voice-agent
    runtime: docker
    plan: starter
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.agent
    autoDeploy: true
    envVars:
      - fromGroup: clinic-voice-shared
      - key: ANALYSIS_WORKER_ENABLED
        value: "false"
