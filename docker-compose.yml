services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --eval '
          try { rs.status() }
          catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongo:27017" }]
            })
          }
        '

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: clinic_voice_ai
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      RATE_LIMIT_ENABLED: "true"
      ANALYSIS_WORKER_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.agent
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: clinic_voice_ai
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
